<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
<style>
  :root { color-scheme: light dark; }
  .orbital { stroke: #0ea5e9; }
  .nucleus { fill: #0ea5e9; }
  .electron { fill: #0ea5e9; }
  @media (prefers-color-scheme: dark) {
    .orbital { stroke: #38bdf8; }
    .nucleus { fill: #38bdf8; }
    .electron { fill: #38bdf8; }
  }
</style>
<ellipse cx="24" cy="24" rx="20" ry="10" class="orbital" stroke-width="2" transform="rotate(-30 24 24)" opacity="0.6" fill="none"/>
<ellipse cx="24" cy="24" rx="20" ry="10" class="orbital" stroke-width="2" transform="rotate(30 24 24)" opacity="0.6" fill="none"/>
<ellipse cx="24" cy="24" rx="20" ry="10" class="orbital" stroke-width="2" transform="rotate(90 24 24)" opacity="0.6" fill="none"/>
<circle cx="24" cy="24" r="5" class="nucleus"/>
<circle cx="24" cy="4" r="2.5" class="electron" opacity="0.8"/>
<circle cx="41" cy="33" r="2.5" class="electron" opacity="0.8"/>
<circle cx="7" cy="33" r="2.5" class="electron" opacity="0.8"/>
</svg>
